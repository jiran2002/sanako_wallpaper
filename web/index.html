    <title>壁纸站</title>
    <script>
      // 首屏前同步应用主题，避免闪白；默认浅色，深色仅在手动切换后生效
      (function () {
        try {
          var saved = localStorage.getItem('wp_theme')
          document.documentElement.classList.toggle('dark', saved === 'dark')
        } catch (e) {}
      })()
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
